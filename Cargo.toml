[workspace]
resolver = "2"
members = ["crates/relay-wire", "crates/server"]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.88"
license-file = "LICENSE"
repository = "https://github.com/99oblivius/vrc-we-server"
publish = false

[workspace.dependencies]
relay-wire = { path = "crates/relay-wire" }

thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
futures-util = "0.3"
parking_lot = "0.12"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
